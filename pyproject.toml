[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jevops"
version = "0.1.0"
description = "Synthetic real-time exception-triage experiments for Rules, Jev, and an LLM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.84,<1",
  "typesafe-sdk>=0.7,<0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
jevops = "jevops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
