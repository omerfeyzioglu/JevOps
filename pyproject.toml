[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jevops"
version = "0.1.0"
description = "Auditable operational decision benchmarks with deterministic evidence and safety gates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "confluent-kafka>=2.6,<3",
  "google-genai>=2.24,<3",
  "laya==0.3.4",
  "openai>=3.16,<4",
  "prometheus-client>=0.21,<1",
  "typesafe-sdk>=0.7,<0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.urls]
Repository = "https://github.com/omerfeyzioglu/JevOps"
Results = "https://github.com/omerfeyzioglu/JevOps/tree/main/results"

[project.scripts]
jevops = "jevops.cli:main"
jevops-stream = "jevops.streaming.generator:main"
jevops-decisions = "jevops.streaming.decision_service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
