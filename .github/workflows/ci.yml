name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "confluent-kafka==2.15.1" \
            "google-genai==2.24.0" \
            "openai==3.16.2" \
            "prometheus-client==0.26.0" \
            "typesafe-sdk==0.7.0"
          python -m pip install --no-deps .
      - name: Run unit tests
        run: python -m unittest discover -s tests -q
      - name: Verify committed benchmark summaries
        run: PYTHONPATH=src python scripts/verify_results.py
